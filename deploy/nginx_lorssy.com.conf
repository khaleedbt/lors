# Include this file in nginx's http context (e.g. sites-enabled).
limit_req_zone $binary_remote_addr zone=lors_api:10m rate=10r/s;

server {
    listen 80;
    server_name lorssy.com www.lorssy.com;

    client_max_body_size 20M;

    location /static/ {
        alias /home/halid/app/lors/staticfiles/;
    }

    location /media/leads/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /media/ {
        alias /home/halid/app/lors/media/;
    }

    location / {
        limit_req zone=lors_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
