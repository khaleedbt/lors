# Include in nginx's http context (e.g. sites-enabled).
# Declare this zone once, even when serving several virtual hosts.
limit_req_zone $binary_remote_addr zone=lors_api:10m rate=10r/s;

server {
    server_name lorssy.com www.lorssy.com;

    client_max_body_size 20M;

    # Inherited by every Django proxy location below.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /static/ {
        alias /home/halid/app/lors/staticfiles/;
    }

    # Existing lead photos stay on disk but require staff authentication.
    location ^~ /media/leads/ {
        limit_req zone=lors_api burst=30 nodelay;
        limit_req_status 429;
        proxy_cache off;
        proxy_pass http://127.0.0.1:8001;
    }

    location /media/ {
        alias /home/halid/app/lors/media/;
    }

    # API requests must reach Django, even if a frontend file has the same path.
    location /api/ {
        limit_req zone=lors_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
    }

    location / {
        root /home/halid/app/frontend;
        index index.html;
        try_files $uri $uri/ @django;
    }

    location /assets/ {
        root /home/halid/app/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @django;
    }

    location @django {
        limit_req zone=lors_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8001;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lorssy.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lorssy.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name lorssy.com www.lorssy.com;
    return 301 https://$host$request_uri;
}
